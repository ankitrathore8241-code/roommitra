<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RoomMitra – Find Your Space. Feel at Home.</title>
<style>
:root{--bg:#fff;--fg:#0b1f3a;--mut:#5b6b80;--card:#f3f8fa;--line:#dbe5ec;--teal:#0f9d94;--navy:#0b1f3a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1624;--fg:#eaf1f7;--mut:#9fb0c2;--card:#12243a;--line:#223a55;--teal:#2ec4b6;--navy:#08111d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header b{flex:1;font-size:20px;cursor:pointer}header b span{color:#2ec4b6}
.ib{background:none;border:1px solid #fff4;color:#fff;border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer}
#menu{position:absolute;right:10px;top:56px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px #0005;min-width:210px;display:none;overflow:hidden}
#menu a{display:block;padding:11px 16px;cursor:pointer}#menu a:hover{background:var(--card)}
main{max-width:900px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--navy),#0f6f6a);color:#fff;border-radius:20px;padding:20px}.hero h1{margin:0}
input,select,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}.hero label{color:#cfe}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin:3px 3px 3px 0}.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}.btn.r{background:#c0392b}.btn.t{background:#229ed9}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.rc{cursor:pointer}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--line);margin:2px 3px 0 0}
.mut{color:var(--mut);font-size:14px}.err{color:#c0392b;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9;max-width:90%}
footer{background:var(--navy);color:#cfe;padding:20px;text-align:center;font-size:14px;margin-top:30px}footer a{color:#7fe;margin:0 8px}
</style></head><body>
<header><b onclick="go('home')">Room<span>Mitra</span></b><button class="ib" onclick="tm(event)">⋮</button><div id="menu"></div></header>
<main id="app">Loading…</main>
<footer><div><b>RoomMitra</b> – Find Your Space. Feel at Home. · Betul, Madhya Pradesh</div><div style="margin-top:8px"><a href="mailto:apnashahar660@gmail.com">apnashahar660@gmail.com</a><a href="https://t.me/apnasaharapnagahr" target="_blank" rel="noopener">Telegram</a></div></footer>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb=supabase.createClient("https://aurnjolhfgoldstlwrha.supabase.co","sb_publishable_KKMx17R78tDKx17l0oMbxg_nXQJXJ8q");
var EM="apnashahar660@gmail.com",TG="https://t.me/apnasaharapnagahr";
var AREAS=["Ganj","Civil Lines","Kothi Bazar","Railway Station","Sadar"],TYPES=["Single Room","1 BHK","2 BHK","3 BHK","PG","Hostel","Shared Room","Independent House"];
var me=null,prof=null,adm=false,F={area:"",type:"",max:""};
function $(i){return document.getElementById(i)}
function E(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3500)}
function go(v){location.hash=v;$("menu").style.display="none"}
function opts(a,s){return a.map(function(x){return"<option"+(x==s?" selected":"")+">"+x+"</option>"}).join("")}
function tm(e){e.stopPropagation();var m=$("menu");if(m.style.display=="block"){m.style.display="none";return}
var r=prof&&prof.role,it=[["Home","home"],["Add Your Room","add"]];
if(me)it.push(["My Listings","mine"],["Favourites","saved"]);
it.push(["Contact Admin","contact"],["Help & Support","contact"]);if(adm)it.push(["Admin","admin"]);
it.push(me?["Logout","out"]:["Login / Sign up","login"]);
m.innerHTML=it.map(function(i){return'<a onclick="'+(i[1]=="out"?"out()":"go(\'"+i[1]+"\')")+'">'+i[0]+"</a>"}).join("");m.style.display="block"}
document.addEventListener("click",function(){$("menu").style.display="none"});
async function loadP(){prof=null;adm=false;if(!me)return;var r=await sb.from("users").select("*").eq("id",me.id).maybeSingle();prof=r.data;var a=await sb.from("admin_users").select("user_id").maybeSingle();adm=!!a.data}
async function out(){await sb.auth.signOut();me=null;prof=null;adm=false;toast("Logged out");go("home");R()}
function card(r){return'<div class="card rc" onclick="go(\'room-'+r.id+'\')"><b>'+E(r.title)+'</b> <b style="color:var(--teal)">₹'+r.rent+"/mo</b><div class=\"mut\">"+E(r.area)+", Betul · "+E(r.property_type)+" · "+E(r.furnishing||"")+"</div>"+(r.status&&r.status!="approved"?'<span class="tag">'+E(r.status)+"</span>":"")+(r.suitable_for||[]).map(function(x){return'<span class="tag">'+E(x)+"</span>"}).join("")+"</div>"}
async function pg(){
var h=location.hash.slice(1)||"home",m=h.match(/^room-([0-9a-f-]+)$/);
if(m){var r=await sb.from("properties").select("id,title,property_type,rent,deposit,area,furnishing,suitable_for,status").eq("id",m[1]).maybeSingle();var p=r.data;
if(!p)return'<div class="card">Room not found.</div>';var q=encodeURIComponent(p.area+" Betul Madhya Pradesh");
return'<a href="#home" class="mut">← Back</a><h2>'+E(p.title)+'</h2><div class="card"><b style="font-size:22px;color:var(--teal)">₹'+p.rent+"/month</b><div>Deposit: ₹"+p.deposit+"</div><div>"+E(p.property_type)+" · "+E(p.furnishing||"")+"</div><div>Locality: "+E(p.area)+", Betul</div><div>Suitable for: "+(p.suitable_for||[]).map(E).join(", ")+'</div></div><div id="ct"></div><button class="btn" onclick="call(\''+p.id+'\')">📞 Call Owner</button><a class="btn o" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+q+'">🧭 Directions</a><button class="btn o" onclick="fav(\''+p.id+'\')">♡ Save</button><button class="btn o" onclick="go(\'contact\')">⚠ Report</button>'}
if(h=="login")return'<h2>Login / Sign up</h2><div class="card"><label>Email</label><input id="e" type="email" autocomplete="email"><label>Password (min 6 characters)</label><input id="pw" type="password"><div class="mut" style="margin-top:10px">For a new account only:</div><label>Full name</label><input id="n"><label>Mobile number (not verified)</label><input id="mb" inputmode="numeric" maxlength="10"><label>I am a</label><select id="ro"><option value="seeker">Room Seeker</option><option value="owner">Room Owner</option><option value="both">Both</option></select><div id="er" class="err"></div><button class="btn" onclick="si()">Login</button><button class="btn o" onclick="su()">Create account</button></div>';
if(h=="add"){if(!me)return'<div class="card">Please <a href="#login">login</a> to add a room.</div>';
return'<h2>Add Your Room</h2><div class="card"><div class="mut">Your listing stays Pending until an admin approves it. Photos and ID upload will be added next.</div><label>Property title</label><input id="a1"><label>Type</label><select id="a2">'+opts(TYPES)+'</select><label>Area</label><select id="a3">'+opts(AREAS)+'</select><label>Complete address (private)</label><textarea id="a4" rows="2"></textarea><label>Monthly rent ₹</label><input id="a5" type="number"><label>Security deposit ₹</label><input id="a6" type="number"><label>Furnishing</label><select id="a7">'+opts(["Furnished","Semi-furnished","Unfurnished"])+'</select><label>Suitable for</label>'+["Working Professionals","Students","Single Men","Single Women","Families","Couples","Anyone"].map(function(x){return'<label style="display:inline-block;margin-right:10px"><input type="checkbox" class="sf" value="'+x+'" style="width:auto"> '+x+"</label>"}).join("")+'<div id="er" class="err"></div><button class="btn" onclick="add()">Submit for verification</button></div>'}
if(h=="mine"){if(!me)return'<div class="card">Please <a href="#login">login</a>.</div>';
var l=await sb.from("properties").select("id,title,property_type,rent,area,furnishing,suitable_for,status").eq("owner_id",me.id).order("created_at",{ascending:false});
var n=await sb.from("notifications").select("title,body").eq("user_id",me.id).order("created_at",{ascending:false}).limit(5);
return"<h2>My Listings</h2>"+((n.data||[]).map(function(x){return'<div class="card">🔔 <b>'+E(x.title)+"</b><div class=\"mut\">"+E(x.body)+"</div></div>"}).join(""))+((l.data||[]).length?l.data.map(card).join(""):'<div class="card">No listings yet. <a href="#add">Add your room</a></div>')}
if(h=="saved"){if(!me)return'<div class="card">Please <a href="#login">login</a>.</div>';
var f=await sb.from("favourites").select("property_id");var ids=(f.data||[]).map(function(x){return x.property_id});
var s=ids.length?await sb.from("properties").select("id,title,property_type,rent,area,furnishing,suitable_for").in("id",ids):{data:[]};
return"<h2>Favourites</h2>"+(s.data.length?s.data.map(card).join(""):'<div class="card">No saved rooms yet.</div>')}
if(h=="admin"){if(!adm)return'<div class="card">Admin access only.</div>';
var d=await sb.from("properties").select("*").eq("status","pending").order("created_at");
return"<h2>Admin – pending listings</h2>"+((d.data||[]).length?d.data.map(function(r){return'<div class="card"><b>'+E(r.title)+"</b> ₹"+r.rent+'<div class="mut">'+E(r.area)+" · "+E(r.property_type)+"<br>Address: "+E(r.full_address)+'</div><button class="btn" onclick="dec(\''+r.id+'\',\'approved\')">Approve</button><button class="btn r" onclick="dec(\''+r.id+'\',\'rejected\')">Reject</button></div>'}).join(""):'<div class="card">No pending listings.</div>')}
if(h=="contact")return'<h2>Contact &amp; Help</h2><div class="card"><a class="btn" href="mailto:'+EM+'">✉ '+EM+'</a><a class="btn t" target="_blank" rel="noopener" href="'+TG+'">✈ Telegram</a><div class="mut">Emergency? Call 112.</div></div><div class="card"><label>Type</label><select id="c1"><option>Report a Problem</option><option>Report Fake Room</option><option>Contact Admin</option></select><label>Details</label><textarea id="c2" rows="4"></textarea><div id="er" class="err"></div><button class="btn" onclick="cs()">Open in my email app</button></div>';
var q2=sb.from("properties").select("id,title,property_type,rent,area,furnishing,suitable_for").eq("status","approved").order("created_at",{ascending:false});
if(F.area)q2=q2.ilike("area","%"+F.area+"%");if(F.type)q2=q2.eq("property_type",F.type);if(F.max)q2=q2.lte("rent",+F.max);
var res=await q2;
return'<div class="hero"><h1>RoomMitra</h1><p>Find Your Space. Feel at Home.</p><b>Where are you looking for a room?</b><div class="g"><div><label>City</label><select><option>Betul</option></select></div><div><label>Area</label><input id="fa" list="al" value="'+E(F.area)+'"></div><div><label>Type</label><select id="ft"><option value="">Any</option>'+opts(TYPES,F.type)+'</select></div><div><label>Max rent ₹</label><input id="fm" type="number" value="'+E(F.max)+'"></div></div><p><button class="btn" onclick="srch()">Search</button><a class="btn t" target="_blank" rel="noopener" href="'+TG+'">✈ Telegram</a></p></div><h2>Available rooms</h2>'+(res.error?'<div class="card err">Could not load rooms: '+E(res.error.message)+"</div>":(res.data.length?res.data.map(card).join(""):'<div class="card">No approved rooms yet. Be the first to <a href="#add">add a room</a>.</div>'))}
function srch(){F.area=$("fa").value;F.type=$("ft").value;F.max=$("fm").value;R()}
async function su(){var e=$("e").value.trim(),p=$("pw").value,n=$("n").value.trim(),mb=$("mb").value.trim(),ro=$("ro").value;
if(!e||p.length<6||!n||!/^[6-9]\d{9}$/.test(mb)){$("er").textContent="Fill email, password (6+), name and a valid 10-digit mobile.";return}
var r=await sb.auth.signUp({email:e,password:p});if(r.error){$("er").textContent=r.error.message;return}
if(!r.data.session){$("er").textContent="Account created. Confirm email is ON in Supabase, so check your inbox first.";return}
me=r.data.user;var u=await sb.from("users").insert({id:me.id,full_name:n,mobile:mb,email:e,role:ro});if(u.error){$("er").textContent=u.error.message;return}
if(ro!="seeker")await sb.from("owner_profiles").insert({user_id:me.id});
await loadP();toast("Welcome, "+n);go("home");R()}
async function si(){var r=await sb.auth.signInWithPassword({email:$("e").value.trim(),password:$("pw").value});if(r.error){$("er").textContent=r.error.message;return}
me=r.data.user;await loadP();toast("Logged in");go("home");R()}
async function add(){var g=function(i){return $(i).value.trim()},e=[],fo=[].slice.call(document.querySelectorAll(".sf:checked")).map(function(c){return c.value});
if(!prof)e.push("Please create your profile first (Sign up).");if(g("a1").length<5)e.push("Title is too short.");if(g("a4").length<8)e.push("Enter the complete address.");if(!(+g("a5")>0))e.push("Enter the monthly rent.");if(!fo.length)e.push("Select who it is suitable for.");
if(e.length){$("er").innerHTML=e.join("<br>");return}
var r=await sb.from("properties").insert({owner_id:me.id,title:g("a1"),property_type:g("a2"),area:g("a3"),full_address:g("a4"),rent:+g("a5"),deposit:+g("a6")||0,furnishing:g("a7"),suitable_for:fo});
if(r.error){$("er").textContent=r.error.message;return}
$("app").innerHTML='<div class="card"><h2>✅ Submitted</h2>Your property has been submitted successfully. It will appear publicly after admin verification and approval.<p><button class="btn" onclick="go(\'mine\')">My Listings</button></p></div>'}
async function dec(id,s){var r=await sb.from("properties").update({status:s}).eq("id",id);if(r.error){toast(r.error.message);return}toast("Listing "+s+". Owner notified.");R()}
async function call(id){var r=await sb.rpc("get_owner_contact",{pid:id,channel:"call"});if(r.error){toast(r.error.message);return}
var o=r.data[0];$("ct").innerHTML='<div class="card">Owner: <b>'+E(o.owner_name)+'</b><br><a class="btn" href="tel:'+E(o.mobile)+'">Call '+E(o.mobile)+"</a></div>"}
async function fav(id){if(!me){toast("Please login first");return}var r=await sb.from("favourites").insert({user_id:me.id,property_id:id});toast(r.error?"Already saved or error":"Saved")}
function cs(){var d=$("c2").value.trim();if(d.length<10){$("er").textContent="Please add a few more details.";return}location.href="mailto:"+EM+"?subject="+encodeURIComponent("RoomMitra – "+$("c1").value)+"&body="+encodeURIComponent(d)}
async function R(){$("app").innerHTML=await pg()+'<datalist id="al">'+AREAS.map(function(a){return'<option value="'+a+'">'}).join("")+"</datalist>"}
window.addEventListener("hashchange",function(){R();scrollTo(0,0)});
(async function(){var s=await sb.auth.getSession();me=s.data.session?s.data.session.user:null;await loadP();R()})();
</script></body></html>
